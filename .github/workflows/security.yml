name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly catch for newly disclosed CVEs against unchanged code.
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Scan with the SAME toolchain release.yml builds with, so this job
          # reports on the binary we actually ship. This previously used
          # `go-version: stable`, which passed while the released binaries —
          # built from go.mod's pinned 1.26.2 — carried five known stdlib CVEs.
          # Pinned, a new stdlib CVE fails the weekly cron until the `go`
          # directive is bumped, which is also the fix.
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
